# ============================================================
#  CI —— 两档设计（这是刻意的）
# ------------------------------------------------------------
#  必需档（每次 push / PR 都跑）
#      lint-test  静态检查 + 单元测试（含接口层，进程内 TestClient）
#      gates      安全层 23 项 + MCP 协议 + 检索基线门禁
#      **零成本、不需要任何密钥、不访问外部服务**
#
#  可选档（手动触发，且仓库里配了 DEEPSEEK_API_KEY 才跑）
#      eval-live  真实模型调用：smoke_test --full --strict + 端到端评测
#      会花钱（一次约 ¥0.55），所以不放在每次 push 上
#
#  【为什么必需档不跑 smoke_test.py --full】
#    它的快速档本身就包含"真实调用一次模型"（第 2 层）、RAG 问答（第 4 层），
#    以及接口层里的 POST /chat、/rag/ask、/webhook/alert —— 没有密钥必然失败。
#    所以**接口层的验证改由 tests/test_api_smoke.py 用 TestClient 在进程内完成**：
#    不需要密钥、不需要起服务，覆盖 26 个接口操作的存在性与鉴权边界。
#    真实模型的验证留给可选档，以及本地跑 smoke_test.py --full。
#
#  【lint 的覆盖范围：为什么当前只查 tests/】
#    app/ 与 scripts/ 里有 55 处历史 lint 债（绝大多数是 f-string 无占位符、
#    未使用的局部变量这类死代码，另有 18 处 except 里 raise 未带 from e）。
#    一次性大扫除会把真实改动淹没在 diff 里，所以按里程碑逐目录纳入 ——
#    先保证**新增代码**干净，再把老代码一块块收进来。
#    这条债登记在 docs/redev/01-audit.md 里，不许它悄悄消失。
# ============================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支上新推一次就取消上一次 —— 省 runner，也避免"旧的绿灯"误导
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 测试与自检都不该走真实网络；这里显式声明"本地开发档"，行为与 clone 下来一致
  AUTH_ENABLED: "0"
  OPS_BACKEND: "mock"
  SANDBOX_BACKEND: "mock"

jobs:
  # ------------------------------------------------------------
  # 必需档 1：静态检查 + 单元测试
  # ------------------------------------------------------------
  lint-test:
    name: 静态检查与单元测试（零成本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖（运行时 9 个 + 开发 3 个）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行时依赖数量守卫（README 宣称 9 个）
        run: |
          n=$(grep -vcE '^\s*(#|$)' requirements.txt)
          echo "requirements.txt 里有效依赖行数：$n"
          test "$n" -le 9 || { echo "-> 运行时依赖变多了，README 的『9 个』需要同步改"; exit 1; }

      - name: ruff（lint）
        run: ruff check tests

      - name: mypy（渐进式：当前只覆盖 tests/）
        run: mypy

      - name: pytest
        run: pytest -q

      - name: 上传测试报告（失败时最有用的东西）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            logs/
            .pytest_cache/
          if-no-files-found: ignore

  # ------------------------------------------------------------
  # 必需档 2：安全层 / MCP 协议 / 检索基线
  # ------------------------------------------------------------
  gates:
    name: 安全层 · MCP · 检索基线（零成本）
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 公网安全层 23 项（进程内 TestClient，不需要起服务）
        run: python scripts/security_check.py

      - name: MCP 协议层自检（官方客户端连自己）
        run: python scripts/mcp_check.py

      - name: 构建索引（data/index/ 是 gitignore 的构建产物，CI 里必须现建）
        run: python -m app.rag.pipeline build

      - name: 检索基线门禁（指标退化超容差即失败）
        run: python scripts/eval_baseline.py --top-k 8

      - name: 上传索引与日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gates-artifacts
          path: |
            data/index/
            logs/
          if-no-files-found: ignore

  # ------------------------------------------------------------
  # 可选档：真实模型调用（会花钱，只在手动触发且配了密钥时跑）
  # ------------------------------------------------------------
  eval-live:
    name: 真实模型端到端（可选 · 会花钱）
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 检查密钥是否就绪
        id: gate
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库没有配置 DEEPSEEK_API_KEY，真实模型档跳过。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 全链路自检（严格档：环境未就绪即失败）
        if: steps.gate.outputs.ready == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/smoke_test.py --full --strict

      - name: 端到端评测（40 条，含裸模型对照）
        if: steps.gate.outputs.ready == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/run_eval.py

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/reports/
          if-no-files-found: ignore
